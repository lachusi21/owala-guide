name: 部署網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    name: 打包網頁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 產生 dist/index.html
        run: bash scripts/build.sh

      - name: 保存給 Cloudflare 使用
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

      - name: 保存給 GitHub Pages 使用
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  github-pages:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    name: 部署到 Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: owala-guide
    steps:
      - name: 檢查 Cloudflare 金鑰
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=尚未設定 Cloudflare 金鑰::請在 repo 的 Settings → Secrets and variables → Actions 加入 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。這次先略過 Cloudflare Pages，GitHub Pages 照常部署。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 取得打包好的網頁
        if: steps.check.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: 建立 Cloudflare Pages 專案（已存在就略過）
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || echo "專案已存在，略過建立"

      - name: 上傳到 Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
